// Firebase Realtime Database silently drops empty arrays/objects (they come
// back as `undefined`, not `[]`). Normalize on every read so downstream code
// can always assume arrays exist.
function normalizeRoom(raw) {
  if (!raw) return raw;
  const state = raw;
  state.deck = state.deck || [];
  state.discard = state.discard || [];
  state.log = state.log || [];
  state.players = (state.players || []).map(p => ({
    ...p,
    hand: p.hand || []
  }));
  return state;
}
async function loadRoom(code) {
  try {
    const snap = await db.ref('rooms/' + code).once('value');
    return snap.exists() ? normalizeRoom(snap.val()) : null;
  } catch (e) {
    return null;
  }
}
async function saveRoom(code, state) {
  try {
    await db.ref('rooms/' + code).set(state);
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      err: e && (e.message || e.toString()) || 'Erreur inconnue.'
    };
  }
}
function subscribeRoom(code, cb) {
  const ref = db.ref('rooms/' + code);
  const handler = snap => {
    if (snap.exists()) cb(normalizeRoom(snap.val()));
  };
  ref.on('value', handler);
  return () => ref.off('value', handler);
}
